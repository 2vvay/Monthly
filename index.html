<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monthly Cycle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #F5F5F7; -webkit-tap-highlight-color: transparent; }
    .bg-stripes-predict { background-image: repeating-linear-gradient(45deg, #fff, #fff 3px, #fca5a5 3px, #fca5a5 6px); }
    .bg-stripes-possible { background-image: repeating-linear-gradient(45deg, #fff, #fff 3px, #fecdd3 3px, #fecdd3 6px); }
    .modal-up { transform: translateY(0); }
    .modal-down { transform: translateY(100%); }
  </style>
</head>
<body class="font-sans text-gray-900 pb-24">
  <div class="max-w-md mx-auto">

    <!-- Header -->
    <div class="pt-12 pb-4 px-6 flex justify-between items-center">
      <h1 class="text-3xl font-bold tracking-tight">Cycle</h1>
      <div class="flex items-center space-x-2 text-sm bg-white px-3 py-1.5 rounded-full shadow-sm" id="sync-status">
        <div class="w-2 h-2 rounded-full bg-yellow-400"></div>
        <span class="text-gray-500">동기화 준비...</span>
      </div>
    </div>

    <!-- Info Card -->
    <div class="px-6 mb-6">
      <div class="bg-white rounded-3xl p-6 shadow-[0_2px_10px_rgba(0,0,0,0.04)]">
        <p class="text-sm text-gray-500 mb-1 font-medium">예정일 안내</p>
        <h2 id="status-title" class="text-2xl font-bold mb-2">계산 중...</h2>
        <p id="status-desc" class="text-gray-400 text-sm">기록을 분석하고 있습니다.</p>
      </div>
    </div>

    <!-- Calendar Controls -->
    <div class="px-6 mb-4 flex justify-between items-center">
      <button onclick="changeMonth(-1)" class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm font-bold">&lt;</button>
      <h3 id="month-display" class="text-lg font-bold"></h3>
      <button onclick="changeMonth(1)" class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm font-bold">&gt;</button>
    </div>

    <!-- Calendar Grid -->
    <div class="px-6 mb-8">
      <div class="bg-white rounded-3xl p-4 shadow-[0_2px_10px_rgba(0,0,0,0.04)]">
        <div class="grid grid-cols-7 gap-1 text-center text-xs font-medium text-gray-400 mb-2">
          <div class="text-red-400">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center"></div>
      </div>
    </div>

    <!-- Legend -->
    <div class="px-6 mb-10">
      <div class="bg-white rounded-3xl p-5 shadow-[0_2px_10px_rgba(0,0,0,0.04)]">
        <p class="text-xs text-gray-400 font-medium mb-4">아이콘 설명</p>
        <div class="grid grid-cols-2 gap-y-4 gap-x-2 text-sm">
          <div class="flex items-center"><div class="w-4 h-4 rounded-full bg-red-400 mr-2"></div>생리</div>
          <div class="flex items-center"><div class="w-4 h-4 rounded-full bg-stripes-predict border border-red-200 mr-2"></div>생리 예측일</div>
          <div class="flex items-center"><div class="w-4 h-4 rounded-full bg-stripes-possible border border-red-100 mr-2"></div>생리 가능일</div>
          <div class="flex items-center"><div class="w-4 h-4 rounded-full bg-red-50 mr-2"></div>가임기</div>
          <div class="flex items-center"><div class="text-base mr-2">💊</div>피임약 (주기 제외)</div>
          <div class="flex items-center"><div class="w-2 h-2 rounded-full bg-pink-400 mx-1 mr-3"></div>부정출혈</div>
          <div class="flex items-center"><div class="text-base mr-2">❤️</div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Action Button -->
  <div class="fixed bottom-6 left-0 right-0 flex justify-center pointer-events-none">
    <button onclick="openModal(new Date())" class="pointer-events-auto w-14 h-14 bg-white rounded-full shadow-[0_4px_20px_rgba(0,0,0,0.1)] flex items-center justify-center text-2xl">
      ✨
    </button>
  </div>

  <!-- Backdrop & Modal -->
  <div id="backdrop" onclick="closeModal()" class="fixed inset-0 bg-black/20 opacity-0 pointer-events-none transition-opacity duration-300 z-40"></div>
  <div id="modal" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white rounded-t-[32px] p-6 pt-2 z-50 transition-transform duration-300 modal-down shadow-[0_-10px_40px_rgba(0,0,0,0.1)]">
    <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto my-3 mb-6"></div>
    <div class="flex justify-between items-center mb-6">
      <h3 id="modal-date" class="text-xl font-bold"></h3>
      <button onclick="closeModal()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 font-bold">✕</button>
    </div>
    <div class="space-y-3 mb-8">
      <label class="flex items-center justify-between p-4 bg-[#F5F5F7] rounded-2xl active:bg-gray-200 transition-colors">
        <span class="font-medium flex items-center"><div class="w-3 h-3 rounded-full bg-red-400 mr-3"></div>생리 했음</span>
        <input type="checkbox" id="toggle-period" class="w-6 h-6 rounded accent-red-400">
      </label>
      <label class="flex items-center justify-between p-4 bg-[#F5F5F7] rounded-2xl active:bg-gray-200 transition-colors">
        <span class="font-medium flex items-center"><div class="w-2 h-2 rounded-full bg-pink-400 mx-0.5 mr-3"></div>부정출혈</span>
        <input type="checkbox" id="toggle-spotting" class="w-6 h-6 rounded accent-pink-400">
      </label>
      <label class="flex items-center justify-between p-4 bg-[#F5F5F7] rounded-2xl active:bg-gray-200 transition-colors">
        <span class="font-medium flex items-center"><span class="text-lg mr-2">💊</span>피임약 복용</span>
        <input type="checkbox" id="toggle-pill" class="w-6 h-6 rounded accent-yellow-500">
      </label>
      <label class="flex items-center justify-between p-4 bg-[#F5F5F7] rounded-2xl active:bg-gray-200 transition-colors">
        <span class="font-medium flex items-center"><span class="text-lg mr-2">❤️</span></span>
        <input type="checkbox" id="toggle-heart" class="w-6 h-6 rounded accent-red-500">
      </label>
    </div>
    <button onclick="saveLog()" class="w-full py-4 bg-black text-white rounded-2xl font-bold text-lg active:bg-gray-800 transition-colors">기록 저장하기</button>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyBY_GQCZ3q6w9ZT5E06H15g_uhl-qTuYZZy7RKwNKA_SsOpRk1K1sS6pBclaWjnvi-/exec';
    const LS_KEY = 'myCycleLogs';
    const DAY = 1000 * 60 * 60 * 24;

    const defaultLogs = {
      "2026-05-10": { period: true }, "2026-05-11": { period: true }, "2026-05-12": { period: true, pill: true }, "2026-05-13": { period: true },
      "2026-07-29": { spotting: true }, "2026-07-30": { spotting: true }, "2026-07-31": { spotting: true }, "2026-08-01": { spotting: true },
      "2026-08-02": { spotting: true }, "2026-08-03": { spotting: true }, "2026-08-04": { spotting: true },
      "2026-09-20": { period: true }, "2026-09-21": { period: true }, "2026-09-22": { period: true }, "2026-09-23": { period: true }, "2026-09-24": { period: true },
      "2026-10-18": { period: true }, "2026-10-19": { period: true }, "2026-10-20": { period: true }, "2026-10-21": { period: true }, "2026-10-22": { period: true },
      "2026-11-16": { period: true }, "2026-11-17": { period: true }, "2026-11-18": { period: true }, "2026-11-19": { period: true }, "2026-11-20": { period: true }
    };

    // ---------- 데이터 ----------
    let logs = JSON.parse(JSON.stringify(defaultLogs));
    try {
      const saved = localStorage.getItem(LS_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && Object.keys(parsed).length > 0) logs = parsed;
      }
    } catch (e) {}

    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()); // 시간 제거
    let currentDate = new Date(today.getFullYear(), today.getMonth(), 1);
    let selectedDateStr = "";

    function fmtDate(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function parseDate(s) {
      const [y, m, d] = s.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    function hasAnyFlag(l) { return !!(l && (l.period || l.spotting || l.pill || l.heart)); }
    function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(logs)); } catch (e) {} }

    // 날짜별 u(수정시각)가 큰 쪽이 이김. 삭제는 u가 찍힌 '빈 항목'으로 남겨 둠(tombstone)
    function mergeLogs(a, b) {
      const out = {};
      Object.keys(a || {}).forEach(k => out[k] = a[k]);
      Object.keys(b || {}).forEach(k => {
        if (!out[k] || ((b[k] && b[k].u) || 0) > ((out[k] && out[k].u) || 0)) out[k] = b[k];
      });
      return out;
    }

    // 항목 기록 (모두 false여도 u를 남겨 삭제 사실을 동기화)
    function setLog(dateStr, flags, stamp) {
      logs[dateStr] = {
        period: !!flags.period, spotting: !!flags.spotting,
        pill: !!flags.pill, heart: !!flags.heart, u: stamp
      };
    }

    // ---------- 동기화 ----------
    function updateSyncStatus(text, colorClass) {
      document.getElementById('sync-status').innerHTML =
        `<div class="w-2 h-2 rounded-full ${colorClass}"></div><span class="text-gray-500">${text}</span>`;
    }

    async function fetchServer() {
      const res = await fetch(SCRIPT_URL + "?t=" + Date.now(), { redirect: 'follow', cache: 'no-store' });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!data || typeof data !== 'object' || data.ok === false) throw new Error("bad response");
      return data;
    }

    // 서버에 푸시. 서버가 병합한 최종본을 돌려주면 그걸로 갱신
    let pushing = false, pushAgain = false;
    async function pushToServer() {
      if (pushing) { pushAgain = true; return; }
      pushing = true;
      updateSyncStatus("저장 중...", "bg-yellow-400");
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // preflight 회피
          body: JSON.stringify(logs),
          redirect: 'follow'
        });
        const result = await res.json();
        if (result && result.ok) {
          logs = mergeLogs(logs, result.logs || {});
          saveLocal();
          renderCalendar();
          updateSyncStatus("연결됨", "bg-green-400");
        } else {
          console.error(result && result.error);
          updateSyncStatus("서버 오류", "bg-red-400");
        }
      } catch (e) {
        console.error(e);
        updateSyncStatus("로컬 저장됨", "bg-yellow-400");
      } finally {
        pushing = false;
        if (pushAgain) { pushAgain = false; pushToServer(); }
      }
    }

    async function loadData() {
      updateSyncStatus("동기화 중...", "bg-yellow-400");
      try {
        const server = await fetchServer();
        const merged = mergeLogs(logs, server);
        const changedVsServer = JSON.stringify(merged) !== JSON.stringify(server);
        logs = merged;
        saveLocal();
        renderCalendar();
        if (changedVsServer) await pushToServer();   // 오프라인 때 쓴 기록/기본값을 서버에 반영
        else updateSyncStatus("연결됨", "bg-green-400");
      } catch (error) {
        console.error(error);
        updateSyncStatus("로컬 모드", "bg-gray-400");
        renderCalendar();
      }
    }

    // 앱을 다시 열었을 때(백그라운드 → 포그라운드) 최신 데이터 받기
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !pushing) loadData();
    });

    // ---------- 주기 계산 ----------
    function calculatePredictions() {
      const periodStarts = [];
      let currentCycleStart = null;
      let hasPillInCycle = false;

      Object.keys(logs).sort().forEach(dateStr => {
        const log = logs[dateStr];
        if (log.period) {
          const prev = parseDate(dateStr);
          prev.setDate(prev.getDate() - 1);
          const prevLog = logs[fmtDate(prev)];
          if (!prevLog || !prevLog.period) {
            if (currentCycleStart) periodStarts.push({ start: currentCycleStart, pill: hasPillInCycle });
            currentCycleStart = dateStr;
            hasPillInCycle = false;
          }
        }
        if (log.pill) hasPillInCycle = true;
      });
      if (currentCycleStart) periodStarts.push({ start: currentCycleStart, pill: hasPillInCycle });

      let totalDays = 0, validCycles = 0;
      for (let i = 0; i < periodStarts.length - 1; i++) {
        if (!periodStarts[i].pill) {               // 피임약 복용 주기는 제외
          const diff = Math.round((parseDate(periodStarts[i + 1].start) - parseDate(periodStarts[i].start)) / DAY);
          if (diff >= 20 && diff <= 45) { totalDays += diff; validCycles++; }
        }
      }

      const avgCycle = validCycles > 0 ? Math.round(totalDays / validCycles) : 28;
      let nextPeriod = null;
      if (periodStarts.length > 0) {
        nextPeriod = parseDate(periodStarts[periodStarts.length - 1].start);
        nextPeriod.setDate(nextPeriod.getDate() + avgCycle);
      }
      return { avgCycle, nextPeriod };
    }

    // ---------- 렌더링 ----------
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById('month-display').innerText = `${year}년 ${month + 1}월`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const grid = document.getElementById('calendar-grid');
      let html = '';

      const { avgCycle, nextPeriod } = calculatePredictions();

      if (nextPeriod) {
        const diff = Math.round((nextPeriod - today) / DAY);
        const title = document.getElementById('status-title');
        if (diff > 0) title.innerText = `${diff}일 뒤 시작 예정`;
        else if (diff === 0) title.innerText = `오늘 시작 예정`;
        else title.innerText = `진행 중 또는 지연됨`;
        document.getElementById('status-desc').innerText = `평균 ${avgCycle}일 주기로 계산됨`;
      } else {
        document.getElementById('status-title').innerText = `기록을 시작해주세요`;
        document.getElementById('status-desc').innerText = `과거 데이터를 기반으로 분석합니다.`;
      }

      for (let i = 0; i < firstDay; i++) html += `<div class="h-14"></div>`;

      for (let i = 1; i <= daysInMonth; i++) {
        const d = new Date(year, month, i);
        const dateStr = fmtDate(d);
        const log = logs[dateStr] || {};
        const isToday = dateStr === fmtDate(today);

        let bgClass = "bg-white", textClass = "text-gray-700";
        const dotHTML = log.spotting ? `<div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-pink-400 rounded-full z-20"></div>` : '';
        const heartHTML = log.heart ? `<div class="absolute top-0 right-0 text-[10px] z-20">❤️</div>` : '';
        const pillHTML = log.pill ? `<div class="absolute -bottom-1 -right-1 text-[12px] z-20">💊</div>` : '';

        if (log.period) {
          bgClass = "bg-red-400"; textClass = "text-white";
        } else if (nextPeriod) {
          const diffFromNext = Math.round((d - nextPeriod) / DAY);
          if (diffFromNext >= 0 && diffFromNext < 5) { bgClass = "bg-stripes-predict border border-red-200"; textClass = "text-red-600"; }
          else if (diffFromNext >= -3 && diffFromNext < 0) { bgClass = "bg-stripes-possible border border-red-100"; textClass = "text-red-400"; }
          else if (diffFromNext >= -17 && diffFromNext <= -11) { bgClass = "bg-red-50"; textClass = "text-red-400"; }
        }

        const todayRing = isToday ? 'ring-2 ring-pink-300 font-bold' : '';

        html += `
          <div onclick="openModal(new Date(${year}, ${month}, ${i}))"
               class="h-14 relative flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-transform">
            <div class="w-10 h-10 rounded-full flex items-center justify-center relative ${bgClass} ${textClass} ${todayRing}">
              <span class="relative z-10">${i}</span>${dotHTML}${heartHTML}${pillHTML}
            </div>
          </div>`;
      }
      grid.innerHTML = html;
    }

    function changeMonth(delta) {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + delta, 1);
      renderCalendar();
    }

    // ---------- 모달 ----------
    function openModal(d) {
      selectedDateStr = fmtDate(d);
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      document.getElementById('modal-date').innerText = `${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
      const log = logs[selectedDateStr] || {};
      document.getElementById('toggle-period').checked = !!log.period;
      document.getElementById('toggle-spotting').checked = !!log.spotting;
      document.getElementById('toggle-pill').checked = !!log.pill;
      document.getElementById('toggle-heart').checked = !!log.heart;

      document.getElementById('backdrop').classList.replace('opacity-0', 'opacity-100');
      document.getElementById('backdrop').classList.replace('pointer-events-none', 'pointer-events-auto');
      document.getElementById('modal').classList.replace('modal-down', 'modal-up');
    }

    function closeModal() {
      document.getElementById('backdrop').classList.replace('opacity-100', 'opacity-0');
      document.getElementById('backdrop').classList.replace('pointer-events-auto', 'pointer-events-none');
      document.getElementById('modal').classList.replace('modal-up', 'modal-down');
    }

    // ---------- 저장 ----------
    function saveLog() {
      const period = document.getElementById('toggle-period').checked;
      const spotting = document.getElementById('toggle-spotting').checked;
      const pill = document.getElementById('toggle-pill').checked;
      const heart = document.getElementById('toggle-heart').checked;
      const wasPeriod = !!(logs[selectedDateStr] && logs[selectedDateStr].period);
      const stamp = Date.now();

      setLog(selectedDateStr, { period, spotting, pill, heart }, stamp);

      // 생리 처음 체크 → 해당일 포함 5일 자동 기록
      if (period && !wasPeriod) {
        const d = parseDate(selectedDateStr);
        for (let i = 1; i < 5; i++) {
          d.setDate(d.getDate() + 1);
          const k = fmtDate(d);
          const cur = logs[k] || {};
          setLog(k, { period: true, spotting: cur.spotting, pill: cur.pill, heart: cur.heart }, stamp);
        }
      }

      // 생리 체크 해제 → 뒤 4일의 생리 기록만 해제 (다른 기록은 유지)
      if (!period && wasPeriod) {
        const d = parseDate(selectedDateStr);
        for (let i = 1; i < 5; i++) {
          d.setDate(d.getDate() + 1);
          const k = fmtDate(d);
          const cur = logs[k];
          if (cur && cur.period) {
            setLog(k, { period: false, spotting: cur.spotting, pill: cur.pill, heart: cur.heart }, stamp);
          }
        }
      }

      // 1) 로컬에 즉시 저장 + 화면 반영
      saveLocal();
      closeModal();
      renderCalendar();

      // 2) 백그라운드로 서버 전송 (서버에서 상대방 변경분과 병합)
      pushToServer();
    }

    loadData();
  </script>
</body>
</html>
