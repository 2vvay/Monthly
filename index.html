<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cycle Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        apple: {
                            bg: '#F5F5F7',       /* iOS System Background */
                            card: '#FFFFFF',
                            text: '#1D1D1F',     /* iOS Primary Text */
                            muted: '#86868B',    /* iOS Secondary Text */
                            pink: '#FF9FAD',     /* Elegant muted pink */
                            pinkLight: '#FFF0F2',
                            border: '#E5E5EA'
                        }
                    },
                    boxShadow: {
                        'apple': '0 4px 24px rgba(0, 0, 0, 0.04)',
                        'apple-lg': '0 10px 40px rgba(0, 0, 0, 0.08)',
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"Inter"', '"Segoe UI"', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #F5F5F7;
            color: #1D1D1F;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
        }

        /* Hide scrollbar */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Modal Animations */
        .modal-enter { transform: translateY(0%); }
        .modal-exit { transform: translateY(100%); }
        .backdrop-enter { opacity: 1; pointer-events: auto; }
        .backdrop-exit { opacity: 0; pointer-events: none; }
        
        /* Smooth Transitions */
        .transition-apple { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

        /* iOS style stripes for predictions */
        .bg-stripes-pink {
            background-image: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 4px,
                rgba(255, 159, 173, 0.15) 4px,
                rgba(255, 159, 173, 0.15) 8px
            );
        }
        .bg-stripes-pink-strong {
            background-image: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 4px,
                rgba(255, 159, 173, 0.4) 4px,
                rgba(255, 159, 173, 0.4) 8px
            );
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <!-- Mobile App Container -->
    <div class="w-full max-w-md h-[100dvh] sm:h-[850px] sm:max-h-[90vh] relative overflow-hidden flex flex-col sm:rounded-[2.5rem] sm:shadow-apple-lg bg-apple-bg">
        
        <!-- Header & Summary Card -->
        <div class="px-6 pt-12 pb-6 z-10 bg-apple-bg shrink-0">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-apple-text tracking-tight">Cycle</h1>
                <div id="sync-status" class="text-xs font-medium text-apple-muted bg-white px-3 py-1.5 rounded-full shadow-sm flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-apple-pink animate-pulse"></div> 연결 중
                </div>
            </div>
            
            <div class="bg-white rounded-3xl p-6 shadow-apple">
                <h2 class="text-xs font-semibold text-apple-muted uppercase tracking-widest mb-2">예정일 안내</h2>
                <div id="status-text" class="text-[28px] leading-tight font-bold text-apple-text tracking-tight">기록 시작하기</div>
                <div id="sub-status-text" class="text-sm font-medium text-apple-muted mt-2">28일 주기로 자동 계산됩니다.</div>
            </div>
        </div>

        <!-- Calendar Section -->
        <div class="flex-1 overflow-y-auto hide-scrollbar px-6 pb-24 z-10 bg-apple-bg rounded-t-3xl">
            
            <!-- Month Navigation -->
            <div class="flex justify-between items-center mb-6 pt-4">
                <button id="prev-month" class="w-10 h-10 rounded-full flex items-center justify-center text-apple-text bg-white shadow-sm hover:bg-gray-50 transition-colors">
                    <i class="fa-solid fa-chevron-left text-sm"></i>
                </button>
                <h3 id="current-month-year" class="text-[17px] font-semibold text-apple-text tracking-tight">2026년 11월</h3>
                <button id="next-month" class="w-10 h-10 rounded-full flex items-center justify-center text-apple-text bg-white shadow-sm hover:bg-gray-50 transition-colors">
                    <i class="fa-solid fa-chevron-right text-sm"></i>
                </button>
            </div>

            <div class="bg-white p-4 rounded-3xl shadow-apple">
                <!-- Days of Week -->
                <div class="grid grid-cols-7 gap-1 mb-3">
                    <div class="text-center text-[11px] font-semibold text-apple-pink">일</div>
                    <div class="text-center text-[11px] font-semibold text-apple-muted">월</div>
                    <div class="text-center text-[11px] font-semibold text-apple-muted">화</div>
                    <div class="text-center text-[11px] font-semibold text-apple-muted">수</div>
                    <div class="text-center text-[11px] font-semibold text-apple-muted">목</div>
                    <div class="text-center text-[11px] font-semibold text-apple-muted">금</div>
                    <div class="text-center text-[11px] font-semibold text-apple-muted">토</div>
                </div>

                <!-- Calendar Grid -->
                <div id="calendar-grid" class="grid grid-cols-7 gap-y-3 gap-x-1">
                    <!-- Days injected by JS -->
                </div>
            </div>

            <!-- Modern Legend -->
            <div class="mt-8 bg-white p-5 rounded-3xl shadow-apple">
                <h4 class="text-[11px] font-semibold text-apple-muted uppercase tracking-widest mb-4">아이콘 설명</h4>
                <div class="grid grid-cols-2 gap-y-4 gap-x-2">
                    <div class="flex items-center gap-3">
                        <div class="w-4 h-4 rounded-full bg-apple-pink shadow-sm"></div>
                        <span class="text-sm font-medium text-apple-text">생리</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-4 h-4 rounded-full bg-stripes-pink-strong border border-apple-pink/30"></div>
                        <span class="text-sm font-medium text-apple-text">생리 예측일</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-4 h-4 rounded-full bg-stripes-pink"></div>
                        <span class="text-sm font-medium text-apple-text">생리 가능일</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-4 h-4 rounded-full bg-apple-pinkLight border border-apple-pink/30"></div>
                        <span class="text-sm font-medium text-apple-text">가임기</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-4 h-4 flex items-center justify-center text-sm">💊</div>
                        <span class="text-sm font-medium text-apple-text">피임약 (주기 제외)</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-2 h-2 rounded-full bg-rose-400 shadow-sm ml-1"></div>
                        <span class="text-sm font-medium text-apple-text ml-1">부정출혈</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-4 h-4 flex items-center justify-center text-sm">❤️</div>
                        <span class="text-sm font-medium text-apple-text"></span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Action Bottom Sheet (Modal) -->
        <div id="modal-backdrop" class="fixed inset-0 z-40 bg-black/20 backdrop-blur-sm backdrop-exit transition-apple"></div>
        
        <div id="action-modal" class="fixed bottom-0 left-0 right-0 z-50 w-full max-w-md mx-auto modal-exit transition-apple sm:pb-4">
            <div class="bg-apple-bg rounded-t-[2.5rem] sm:rounded-[2.5rem] p-6 pb-10 shadow-apple-lg border border-white/50">
                <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-6"></div>
                
                <h3 id="modal-date-title" class="text-[17px] font-semibold text-apple-text mb-6 text-center tracking-tight">날짜 선택</h3>
                
                <div class="space-y-3 bg-white p-2 rounded-[2rem] shadow-sm">
                    <!-- Period Toggle -->
                    <button id="toggle-period-btn" class="w-full flex items-center justify-between p-4 rounded-2xl bg-white transition-all outline-none">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-apple-pinkLight flex items-center justify-center text-lg text-apple-pink">🩸</div>
                            <div class="font-medium text-apple-text">생리</div>
                        </div>
                        <div id="period-toggle-ui" class="w-12 h-7 rounded-full bg-gray-200 relative transition-colors duration-300">
                            <div class="w-6 h-6 rounded-full bg-white absolute top-0.5 left-0.5 shadow-sm transition-transform duration-300 transform"></div>
                        </div>
                    </button>

                    <!-- Intimacy Toggle -->
                    <button id="toggle-intimacy-btn" class="w-full flex items-center justify-between p-4 rounded-2xl bg-white transition-all outline-none">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center text-lg">❤️</div>
                            <div class="font-medium text-apple-text"></div>
                        </div>
                        <div id="intimacy-toggle-ui" class="w-12 h-7 rounded-full bg-gray-200 relative transition-colors duration-300">
                            <div class="w-6 h-6 rounded-full bg-white absolute top-0.5 left-0.5 shadow-sm transition-transform duration-300 transform"></div>
                        </div>
                    </button>

                    <!-- Pill Toggle -->
                    <button id="toggle-pill-btn" class="w-full flex items-center justify-between p-4 rounded-2xl bg-white transition-all outline-none">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-lg">💊</div>
                            <div class="font-medium text-apple-text">피임약</div>
                        </div>
                        <div id="pill-toggle-ui" class="w-12 h-7 rounded-full bg-gray-200 relative transition-colors duration-300">
                            <div class="w-6 h-6 rounded-full bg-white absolute top-0.5 left-0.5 shadow-sm transition-transform duration-300 transform"></div>
                        </div>
                    </button>

                    <!-- Spotting Toggle -->
                    <button id="toggle-spotting-btn" class="w-full flex items-center justify-between p-4 rounded-2xl bg-white transition-all outline-none">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-rose-50 flex items-center justify-center text-lg">
                                <div class="w-3 h-3 rounded-full bg-rose-400"></div>
                            </div>
                            <div class="font-medium text-apple-text">부정출혈</div>
                        </div>
                        <div id="spotting-toggle-ui" class="w-12 h-7 rounded-full bg-gray-200 relative transition-colors duration-300">
                            <div class="w-6 h-6 rounded-full bg-white absolute top-0.5 left-0.5 shadow-sm transition-transform duration-300 transform"></div>
                        </div>
                    </button>
                </div>
                
                <button id="close-modal-btn" class="w-full mt-6 py-4 rounded-[1.5rem] font-semibold text-apple-text bg-white shadow-sm hover:bg-gray-50 transition-colors">닫기</button>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cycle-sync-modern';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { /* Fallback */ };

        let app, db, auth, user;
        let loggedData = new Map(); 
        let activeModalDate = null;
        let currentDate = new Date(2026, 10, 1); // Set to Nov 2026 for context of preloaded data

        const toggles = {
            period: { btn: document.getElementById('toggle-period-btn'), ui: document.getElementById('period-toggle-ui'), activeColor: 'bg-apple-pink' },
            intimacy: { btn: document.getElementById('toggle-intimacy-btn'), ui: document.getElementById('intimacy-toggle-ui'), activeColor: 'bg-red-400' },
            pill: { btn: document.getElementById('toggle-pill-btn'), ui: document.getElementById('pill-toggle-ui'), activeColor: 'bg-blue-400' },
            spotting: { btn: document.getElementById('toggle-spotting-btn'), ui: document.getElementById('spotting-toggle-ui'), activeColor: 'bg-rose-400' }
        };

        const monthYearEl = document.getElementById('current-month-year');
        const gridEl = document.getElementById('calendar-grid');
        const statusTextEl = document.getElementById('status-text');
        const subStatusTextEl = document.getElementById('sub-status-text');
        const syncStatusEl = document.getElementById('sync-status');
        const modalDateTitle = document.getElementById('modal-date-title');
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modal = document.getElementById('action-modal');

        // Preload past dates from the requirements (Adjusted to hit Nov 18 prediction)
        const preloadedData = [
            // Cycle 1 (May - Pill taken -> excluded)
            { date: '2026-05-27', period: true, intimacy: false, pill: false, spotting: false },
            { date: '2026-06-05', period: false, intimacy: false, pill: true, spotting: false },
            // Cycle 2 (June)
            { date: '2026-06-30', period: true, intimacy: true, pill: false, spotting: false },
            // Cycle 3 (July)
            { date: '2026-07-28', period: true, intimacy: false, pill: false, spotting: false },
            // Spotting late July - early Aug
            { date: '2026-07-29', period: false, intimacy: false, pill: false, spotting: true },
            { date: '2026-07-30', period: false, intimacy: false, pill: false, spotting: true },
            { date: '2026-07-31', period: false, intimacy: false, pill: false, spotting: true },
            { date: '2026-08-01', period: false, intimacy: false, pill: false, spotting: true },
            { date: '2026-08-02', period: false, intimacy: false, pill: false, spotting: true },
            { date: '2026-08-03', period: false, intimacy: false, pill: false, spotting: true },
            { date: '2026-08-04', period: false, intimacy: false, pill: false, spotting: true },
            // Cycle 4 (August)
            { date: '2026-08-26', period: true, intimacy: true, pill: false, spotting: false },
            // Cycle 5 (September)
            { date: '2026-09-23', period: true, intimacy: false, pill: false, spotting: false },
            // Cycle 6 (October) -> Points next expected to Nov 18
            { date: '2026-10-21', period: true, intimacy: true, pill: false, spotting: false },
        ];

        // Initialize local map with preloaded dates so it shows up immediately
        preloadedData.forEach(d => {
            loggedData.set(d.date, { period: d.period, intimacy: d.intimacy, pill: d.pill, spotting: d.spotting });
        });

        // Utilities
        const formatDate = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };
        const parseDate = (str) => {
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d);
        };
        const addDays = (date, days) => {
            const result = new Date(date);
            result.setDate(result.getDate() + days);
            return result;
        };
        const diffDays = (d1, d2) => Math.round((d2 - d1) / (1000 * 60 * 60 * 24));

        // Prediction Logic (Dynamic cycle with Pill exclusion)
        function calculatePredictions() {
            const periodDates = Array.from(loggedData.entries())
                .filter(([_, data]) => data.period)
                .map(([d]) => d)
                .sort();
            
            if (periodDates.length === 0) return null;

            // Find start dates of cycles
            const startDates = [];
            for (let i = 0; i < periodDates.length; i++) {
                if (i === 0) startDates.push(periodDates[i]);
                else {
                    const curr = parseDate(periodDates[i]);
                    const prev = parseDate(periodDates[i-1]);
                    if (diffDays(prev, curr) > 10) startDates.push(periodDates[i]); 
                }
            }

            const latestStartStr = startDates[startDates.length - 1];
            const latestStartDate = parseDate(latestStartStr);

            // Calculate dynamic average cycle length EXCLUDING cycles with pills
            let validCyclesCount = 0;
            let totalValidDays = 0;

            if (startDates.length > 1) {
                for (let i = 1; i < startDates.length; i++) {
                    const prevStart = parseDate(startDates[i-1]);
                    const currStart = parseDate(startDates[i]);
                    
                    // Check if any pill was logged during this specific cycle window
                    let hasPill = false;
                    for (let d = new Date(prevStart); d < currStart; d.setDate(d.getDate() + 1)) {
                        if (loggedData.get(formatDate(d))?.pill) {
                            hasPill = true;
                            break;
                        }
                    }

                    // Only count cycle if no pills were taken to preserve natural average
                    if (!hasPill) {
                        totalValidDays += diffDays(prevStart, currStart);
                        validCyclesCount++;
                    }
                }
            }

            let cycleLength = validCyclesCount > 0 ? Math.round(totalValidDays / validCyclesCount) : 28;

            // Predict based on dynamic cycle length
            const nextExpectedDate = addDays(latestStartDate, cycleLength);
            
            // 배란일 = 다음 예정일 - 14일
            const ovulationDate = addDays(nextExpectedDate, -14);

            // 가임기 = 배란일 5일 전 ~ 배란일 1일 후 (총 7일)
            const fertileSet = new Set();
            for (let i = -5; i <= 1; i++) fertileSet.add(formatDate(addDays(ovulationDate, i)));

            // 생리 예측일 & 생리 가능일 (iOS Style: 가능일은 5일 전 ~ 2일 후)
            const expectedDateStr = formatDate(nextExpectedDate);
            const possibleSet = new Set();
            for (let i = -5; i <= 2; i++) {
                const pd = formatDate(addDays(nextExpectedDate, i));
                if (pd !== expectedDateStr) possibleSet.add(pd);
            }

            return {
                latestStart: latestStartDate,
                nextExpected: nextExpectedDate,
                expectedDateStr: expectedDateStr,
                possibleDays: possibleSet,
                fertileDays: fertileSet,
                cycleLength: cycleLength
            };
        }

        function updateHeader(predictions) {
            const todayDate = new Date();
            const todayStr = formatDate(todayDate);

            if (!predictions) {
                statusTextEl.textContent = "기록 시작하기";
                subStatusTextEl.textContent = "나만의 주기를 분석해 드릴게요.";
                return;
            }

            const daysUntil = diffDays(todayDate, predictions.nextExpected);
            const todayData = loggedData.get(todayStr) || {};
            const cycleText = `평균 ${predictions.cycleLength}일 주기로 계산됨`;

            if (todayData.period) {
                statusTextEl.textContent = "생리 중 🩸";
                subStatusTextEl.textContent = cycleText;
            } else if (predictions.fertileDays.has(todayStr)) {
                statusTextEl.textContent = "가임기 ✨";
                subStatusTextEl.textContent = `다음 예정일은 ${daysUntil}일 남았습니다.`;
            } else if (daysUntil === 0) {
                statusTextEl.textContent = "오늘이 예정일이에요";
                subStatusTextEl.textContent = cycleText;
            } else if (daysUntil > 0) {
                statusTextEl.textContent = `예정일 D-${daysUntil}`;
                subStatusTextEl.textContent = cycleText;
            } else {
                statusTextEl.textContent = `예정일 ${Math.abs(daysUntil)}일 지남`;
                subStatusTextEl.textContent = cycleText;
            }
        }

        // Render Calendar
        function renderCalendar() {
            gridEl.innerHTML = '';
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            monthYearEl.textContent = `${year}년 ${month + 1}월`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const todayStr = formatDate(new Date());
            
            const predictions = calculatePredictions();
            updateHeader(predictions);

            // Empty slots for start of month
            for (let i = 0; i < firstDay; i++) {
                const cell = document.createElement('div');
                gridEl.appendChild(cell);
            }

            // Days
            for (let i = 1; i <= daysInMonth; i++) {
                const dateObj = new Date(year, month, i);
                const dateStr = formatDate(dateObj);
                const dayData = loggedData.get(dateStr) || {};
                
                const cellWrapper = document.createElement('div');
                cellWrapper.className = 'w-full aspect-square relative flex items-center justify-center';

                const cellBtn = document.createElement('button');
                cellBtn.className = 'w-[85%] h-[85%] flex flex-col items-center justify-center rounded-full relative transition-all outline-none';
                
                // Base styles
                let textClass = 'text-apple-text';
                let bgClass = 'bg-transparent hover:bg-gray-100';

                const isPeriod = dayData.period;
                const isExpected = predictions?.expectedDateStr === dateStr;
                const isPossible = predictions?.possibleDays.has(dateStr);
                const isFertile = predictions?.fertileDays.has(dateStr);

                if (isPeriod) {
                    bgClass = 'bg-apple-pink shadow-sm';
                    textClass = 'text-white font-semibold';
                } else if (isExpected) {
                    bgClass = 'bg-stripes-pink-strong border border-apple-pink/30';
                    textClass = 'text-apple-text font-semibold';
                } else if (isPossible) {
                    bgClass = 'bg-stripes-pink';
                    textClass = 'text-apple-text font-medium';
                } else if (isFertile) {
                    bgClass = 'bg-apple-pinkLight border border-apple-pink/30';
                    textClass = 'text-apple-pink font-medium';
                }

                if (dateStr === todayStr) {
                    textClass += ' font-bold';
                    if (!isPeriod && !isExpected && !isPossible && !isFertile) {
                        bgClass = 'bg-gray-50 ring-2 ring-apple-pink/60 ring-offset-1 z-10 hover:bg-gray-100';
                        textClass = 'text-apple-pink font-bold';
                    } else {
                        bgClass += ' ring-2 ring-apple-pink/60 ring-offset-1 z-10';
                    }
                }

                cellBtn.className += ` ${bgClass} ${textClass}`;
                
                // Number wrapper
                const numSpan = document.createElement('span');
                numSpan.textContent = i;
                numSpan.className = 'text-[15px] z-10 leading-none';
                cellBtn.appendChild(numSpan);

                cellWrapper.appendChild(cellBtn);

                // External Icons wrapper (below the circle)
                const iconContainer = document.createElement('div');
                iconContainer.className = 'absolute -bottom-1 flex gap-0.5 z-20 items-center justify-center';
                
                if (dayData.intimacy) {
                    const h = document.createElement('span');
                    h.textContent = '❤️';
                    h.className = 'text-[10px] leading-none drop-shadow-sm';
                    iconContainer.appendChild(h);
                }
                if (dayData.pill) {
                    const p = document.createElement('span');
                    p.textContent = '💊';
                    p.className = 'text-[10px] leading-none drop-shadow-sm';
                    iconContainer.appendChild(p);
                }
                if (dayData.spotting) {
                    const s = document.createElement('div');
                    s.className = 'w-1.5 h-1.5 rounded-full bg-rose-400 drop-shadow-sm mb-[2px]';
                    iconContainer.appendChild(s);
                }
                
                cellWrapper.appendChild(iconContainer);
                cellBtn.onclick = () => openModal(dateStr);
                gridEl.appendChild(cellWrapper);
            }
        }

        // Modal Logic
        function openModal(dateStr) {
            activeModalDate = dateStr;
            const dateObj = parseDate(dateStr);
            modalDateTitle.textContent = `${dateObj.getFullYear()}년 ${dateObj.getMonth() + 1}월 ${dateObj.getDate()}일`;
            
            updateModalUI();
            
            modalBackdrop.classList.remove('backdrop-exit');
            modalBackdrop.classList.add('backdrop-enter');
            modal.classList.remove('modal-exit');
            modal.classList.add('modal-enter');
        }

        function updateModalUI() {
            const data = loggedData.get(activeModalDate) || { period: false, intimacy: false, pill: false, spotting: false };
            
            Object.keys(toggles).forEach(key => {
                const isActive = data[key];
                const t = toggles[key];
                const thumb = t.ui.children[0];
                
                if (isActive) {
                    t.ui.classList.replace('bg-gray-200', t.activeColor);
                    thumb.classList.add('translate-x-5');
                } else {
                    t.ui.classList.replace(t.activeColor, 'bg-gray-200');
                    thumb.classList.remove('translate-x-5');
                }
            });
        }

        function closeModal() {
            modalBackdrop.classList.remove('backdrop-enter');
            modalBackdrop.classList.add('backdrop-exit');
            modal.classList.remove('modal-enter');
            modal.classList.add('modal-exit');
            setTimeout(() => { activeModalDate = null; }, 400);
        }

        document.getElementById('close-modal-btn').addEventListener('click', closeModal);
        modalBackdrop.addEventListener('click', closeModal);

        Object.keys(toggles).forEach(type => {
            toggles[type].btn.addEventListener('click', () => handleToggle(type));
        });

        async function handleToggle(type) {
            if (!user) return; // Silent return if not connected
            if (!activeModalDate) return;

            const dateStr = activeModalDate;
            const currentData = loggedData.get(dateStr) || { period: false, intimacy: false, pill: false, spotting: false };
            const newData = { ...currentData, [type]: !currentData[type] };

            // Optimistic UI Update
            if (!newData.period && !newData.intimacy && !newData.pill && !newData.spotting) {
                loggedData.delete(dateStr);
            } else {
                loggedData.set(dateStr, newData);
            }
            updateModalUI();
            renderCalendar();

            // Sync to Firebase
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'periodLogs', dateStr);
            try {
                if (!newData.period && !newData.intimacy && !newData.pill && !newData.spotting) {
                    await deleteDoc(docRef);
                } else {
                    await setDoc(docRef, { ...newData, date: dateStr, updatedAt: Date.now() });
                }
            } catch (error) {
                console.error("Sync error:", error);
            }
        }

        function setupSync() {
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'periodLogs');
            let isFirstSnapshot = true;

            onSnapshot(colRef, (snapshot) => {
                // If database is completely empty on first load, seed it with the preloaded dates
                if (isFirstSnapshot && snapshot.empty) {
                    isFirstSnapshot = false;
                    preloadedData.forEach(async (d) => {
                        try {
                            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'periodLogs', d.date);
                            await setDoc(docRef, { period: d.period, intimacy: d.intimacy, pill: d.pill, spotting: d.spotting || false, date: d.date, updatedAt: Date.now() });
                        } catch (e) { console.error("Error seeding data:", e); }
                    });
                    syncStatusEl.innerHTML = '<div class="w-2 h-2 rounded-full bg-apple-pink"></div> 동기화 중';
                    return;
                }
                
                isFirstSnapshot = false;
                let needsRender = false;
                
                // Track current keys to detect deletions from remote
                const remoteKeys = new Set();

                snapshot.forEach(doc => {
                    remoteKeys.add(doc.id);
                    const data = doc.data();
                    const existing = loggedData.get(doc.id);
                    
                    if (!existing || 
                        existing.period !== data.period || 
                        existing.intimacy !== data.intimacy ||
                        existing.pill !== data.pill ||
                        existing.spotting !== data.spotting) {
                        
                        loggedData.set(doc.id, { 
                            period: !!data.period, 
                            intimacy: !!data.intimacy,
                            pill: !!data.pill,
                            spotting: !!data.spotting
                        });
                        needsRender = true;
                    }
                });

                // Remove local entries deleted remotely
                for (const key of loggedData.keys()) {
                    if (!remoteKeys.has(key)) {
                        loggedData.delete(key);
                        needsRender = true;
                    }
                }
                
                syncStatusEl.innerHTML = '<div class="w-2 h-2 rounded-full bg-green-500"></div> 연결됨';
                if (needsRender) renderCalendar();
                
            }, (error) => {
                syncStatusEl.innerHTML = '<i class="fa-solid fa-wifi-slash text-apple-muted"></i> 오프라인';
                console.error(error);
            });
        }

        // Navigation Actions
        document.getElementById('prev-month').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });
        document.getElementById('next-month').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        // Initialize App
        async function init() {
            renderCalendar(); // initial render

            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                user = auth.currentUser;
                setupSync();
            } catch (error) {
                console.error("Firebase Init Error:", error);
                syncStatusEl.innerHTML = '<i class="fa-solid fa-wifi-slash text-apple-muted"></i> 로컬';
            }
        }

        window.onload = init;

    </script>
</body>
</html>
