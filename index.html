<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monthly Cycle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #F5F5F7; -webkit-tap-highlight-color: transparent; }
    .bg-stripes-predict {
      background-image: repeating-linear-gradient(45deg, #fff, #fff 3px, #fca5a5 3px, #fca5a5 6px);
    }
    .bg-stripes-possible {
      background-image: repeating-linear-gradient(45deg, #fff, #fff 3px, #fecdd3 3px, #fecdd3 6px);
    }
    .modal-up { transform: translateY(0); }
    .modal-down { transform: translateY(100%); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="font-sans text-gray-900 pb-20">

  <!-- Header -->
  <div class="pt-12 pb-4 px-6 flex justify-between items-center">
    <h1 class="text-3xl font-bold tracking-tight">Cycle</h1>
    <div class="flex items-center space-x-2 text-sm text-gray-500 bg-white px-3 py-1.5 rounded-full shadow-sm">
      <div class="w-2 h-2 rounded-full bg-green-400"></div>
      <span>기록 중</span>
    </div>
  </div>

  <!-- Info Card -->
  <div class="px-6 mb-6">
    <div class="bg-white rounded-3xl p-6 shadow-[0_2px_10px_rgba(0,0,0,0.04)]">
      <p class="text-sm text-gray-500 mb-1 font-medium">예정일 안내</p>
      <h2 id="status-title" class="text-2xl font-bold mb-2">기록을 분석 중입니다</h2>
      <p id="status-desc" class="text-gray-400 text-sm">평균 주기로 자동 계산됩니다.</p>
    </div>
  </div>

  <!-- Calendar Controls -->
  <div class="px-6 mb-4 flex justify-between items-center">
    <button onclick="changeMonth(-1)" class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm font-bold">&lt;</button>
    <h3 id="month-display" class="text-lg font-bold"></h3>
    <button onclick="changeMonth(1)" class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm font-bold">&gt;</button>
  </div>

  <!-- Calendar Grid -->
  <div class="px-6 mb-8">
    <div class="bg-white rounded-3xl p-4 shadow-[0_2px_10px_rgba(0,0,0,0.04)]">
      <div class="grid grid-cols-7 gap-1 text-center text-xs font-medium text-gray-400 mb-2">
        <div class="text-red-400">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
      </div>
      <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center"></div>
    </div>
  </div>

  <!-- Legend -->
  <div class="px-6 mb-10">
    <div class="bg-white rounded-3xl p-5 shadow-[0_2px_10px_rgba(0,0,0,0.04)]">
      <p class="text-xs text-gray-400 font-medium mb-4">아이콘 설명</p>
      <div class="grid grid-cols-2 gap-y-4 gap-x-2 text-sm">
        <div class="flex items-center"><div class="w-4 h-4 rounded-full bg-red-400 mr-2"></div>생리</div>
        <div class="flex items-center"><div class="w-4 h-4 rounded-full bg-stripes-predict border border-red-200 mr-2"></div>생리 예측일</div>
        <div class="flex items-center"><div class="w-4 h-4 rounded-full bg-stripes-possible border border-red-100 mr-2"></div>생리 가능일</div>
        <div class="flex items-center"><div class="w-4 h-4 rounded-full bg-red-50 mr-2"></div>가임기</div>
        <div class="flex items-center"><div class="text-base mr-2">💊</div>피임약 (주기 제외)</div>
        <div class="flex items-center"><div class="w-2 h-2 rounded-full bg-pink-400 mx-1 mr-3"></div>부정출혈</div>
        <div class="flex items-center"><div class="text-base mr-2">❤️</div></div>
      </div>
    </div>
  </div>

  <!-- Bottom Action Button -->
  <div class="fixed bottom-6 left-0 right-0 flex justify-center pointer-events-none">
    <button onclick="openModal(new Date())" class="pointer-events-auto w-14 h-14 bg-white rounded-full shadow-[0_4px_20px_rgba(0,0,0,0.1)] flex items-center justify-center text-2xl">
      ✨
    </button>
  </div>

  <!-- Backdrop -->
  <div id="backdrop" onclick="closeModal()" class="fixed inset-0 bg-black/20 opacity-0 pointer-events-none transition-opacity duration-300 z-40"></div>

  <!-- Bottom Sheet Modal -->
  <div id="modal" class="fixed bottom-0 left-0 right-0 bg-white rounded-t-[32px] p-6 pt-2 z-50 transition-transform duration-300 modal-down shadow-[0_-10px_40px_rgba(0,0,0,0.1)]">
    <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto my-3 mb-6"></div>
    <div class="flex justify-between items-center mb-6">
      <h3 id="modal-date" class="text-xl font-bold"></h3>
      <button onclick="closeModal()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 font-bold">✕</button>
    </div>
    
    <div class="space-y-3 mb-8">
      <label class="flex items-center justify-between p-4 bg-[#F5F5F7] rounded-2xl active:bg-gray-200 transition-colors">
        <span class="font-medium flex items-center"><div class="w-3 h-3 rounded-full bg-red-400 mr-3"></div>생리 했음</span>
        <input type="checkbox" id="toggle-period" class="w-6 h-6 rounded text-red-400 focus:ring-red-400 accent-red-400">
      </label>
      <label class="flex items-center justify-between p-4 bg-[#F5F5F7] rounded-2xl active:bg-gray-200 transition-colors">
        <span class="font-medium flex items-center"><div class="w-2 h-2 rounded-full bg-pink-400 mx-0.5 mr-3"></div>부정출혈</span>
        <input type="checkbox" id="toggle-spotting" class="w-6 h-6 rounded text-pink-400 focus:ring-pink-400 accent-pink-400">
      </label>
      <label class="flex items-center justify-between p-4 bg-[#F5F5F7] rounded-2xl active:bg-gray-200 transition-colors">
        <span class="font-medium flex items-center"><span class="text-lg mr-2">💊</span>피임약 복용</span>
        <input type="checkbox" id="toggle-pill" class="w-6 h-6 rounded text-yellow-500 focus:ring-yellow-500 accent-yellow-500">
      </label>
      <label class="flex items-center justify-between p-4 bg-[#F5F5F7] rounded-2xl active:bg-gray-200 transition-colors">
        <span class="font-medium flex items-center"><span class="text-lg mr-2">❤️</span></span>
        <input type="checkbox" id="toggle-heart" class="w-6 h-6 rounded text-red-500 focus:ring-red-500 accent-red-500">
      </label>
    </div>
    <button onclick="saveLog()" class="w-full py-4 bg-black text-white rounded-2xl font-bold text-lg active:bg-gray-800 transition-colors">기록 저장하기</button>
  </div>

  <script>
    // 하트 기록 제외, 과거 생리/부정출혈/피임약 데이터 유지
    let logs = {
      "2026-05-10": { period: true },
      "2026-05-11": { period: true },
      "2026-05-12": { period: true, pill: true },
      "2026-05-13": { period: true },
      "2026-07-29": { spotting: true },
      "2026-07-30": { spotting: true },
      "2026-07-31": { spotting: true },
      "2026-08-01": { spotting: true },
      "2026-08-02": { spotting: true },
      "2026-08-03": { spotting: true },
      "2026-08-04": { spotting: true },
      "2026-09-20": { period: true },
      "2026-09-21": { period: true },
      "2026-09-22": { period: true },
      "2026-09-23": { period: true },
      "2026-09-24": { period: true },
      "2026-10-18": { period: true },
      "2026-10-19": { period: true },
      "2026-10-20": { period: true },
      "2026-10-21": { period: true },
      "2026-10-22": { period: true }
    };

    // 실제 오늘 날짜 자동 연동
    const today = new Date(); 
    let currentDate = new Date(today.getFullYear(), today.getMonth(), 1);
    let selectedDateStr = "";

    function fmtDate(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function calculatePredictions() {
      let periodStarts = [];
      let currentCycleStart = null;
      let hasPillInCycle = false;

      const sortedDates = Object.keys(logs).sort();
      sortedDates.forEach(dateStr => {
        if (logs[dateStr].period) {
          let d = new Date(dateStr);
          let prev = new Date(d);
          prev.setDate(prev.getDate() - 1);
          if (!logs[fmtDate(prev)] || !logs[fmtDate(prev)].period) {
            if (currentCycleStart) {
              periodStarts.push({ start: currentCycleStart, pill: hasPillInCycle });
            }
            currentCycleStart = dateStr;
            hasPillInCycle = false;
          }
        }
        if (logs[dateStr].pill) hasPillInCycle = true;
      });
      if (currentCycleStart) {
        periodStarts.push({ start: currentCycleStart, pill: hasPillInCycle });
      }

      let totalDays = 0;
      let validCycles = 0;

      for (let i = 0; i < periodStarts.length - 1; i++) {
        if (!periodStarts[i].pill) { 
          let d1 = new Date(periodStarts[i].start);
          let d2 = new Date(periodStarts[i+1].start);
          let diff = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
          if (diff >= 20 && diff <= 45) { 
            totalDays += diff;
            validCycles++;
          }
        }
      }

      let avgCycle = validCycles > 0 ? Math.round(totalDays / validCycles) : 28;
      let nextPeriod = null;
      
      if (periodStarts.length > 0) {
        let lastStart = new Date(periodStarts[periodStarts.length - 1].start);
        nextPeriod = new Date(lastStart);
        nextPeriod.setDate(nextPeriod.getDate() + avgCycle);
      }

      return { avgCycle, nextPeriod };
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById('month-display').innerText = `${year}년 ${month + 1}월`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      const { avgCycle, nextPeriod } = calculatePredictions();

      if (nextPeriod) {
        let diff = Math.round((nextPeriod - today) / (1000 * 60 * 60 * 24));
        if (diff > 0) {
          document.getElementById('status-title').innerText = `${diff}일 뒤 시작 예정`;
        } else if (diff === 0) {
          document.getElementById('status-title').innerText = `오늘 시작 예정`;
        } else {
          document.getElementById('status-title').innerText = `${Math.abs(diff)}일 지연됨`;
        }
        document.getElementById('status-desc').innerText = `평균 ${avgCycle}일 주기로 계산됨`;
      } else {
        document.getElementById('status-title').innerText = `기록을 시작해주세요`;
        document.getElementById('status-desc').innerText = `과거 데이터를 기반으로 분석합니다.`;
      }

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div class="h-14"></div>`;
      }

      for (let i = 1; i <= daysInMonth; i++) {
        let d = new Date(year, month, i);
        let dateStr = fmtDate(d);
        let log = logs[dateStr] || {};
        let isToday = fmtDate(d) === fmtDate(today);

        let bgClass = "bg-white";
        let textClass = "text-gray-700";
        let innerHTML = `<span class="relative z-10">${i}</span>`;
        let dotHTML = '';
        let heartHTML = log.heart ? `<div class="absolute top-0 right-0 text-[10px] z-20">❤️</div>` : '';
        let pillHTML = log.pill ? `<div class="absolute -bottom-1 -right-1 text-[12px] z-20">💊</div>` : '';

        if (log.period) {
          bgClass = "bg-red-400 text-white";
        } else if (log.spotting) {
          dotHTML = `<div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-pink-400 rounded-full z-20"></div>`;
        }

        if (nextPeriod && !log.period) {
          let diffFromNext = Math.round((d - nextPeriod) / (1000 * 60 * 60 * 24));
          if (diffFromNext >= 0 && diffFromNext < 5) {
            bgClass = "bg-stripes-predict border border-red-200 text-red-600";
          }
          else if (diffFromNext >= -3 && diffFromNext < 0) {
             bgClass = "bg-stripes-possible border border-red-100 text-red-400";
          }
          else if (diffFromNext >= -17 && diffFromNext <= -11) {
            bgClass = "bg-red-50 text-red-400";
          }
        }

        let todayRing = isToday ? 'ring-2 ring-pink-300 font-bold' : '';

        grid.innerHTML += `
          <div onclick="openModal(new Date(${year}, ${month}, ${i}))" 
               class="h-14 relative flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-transform">
            <div class="w-10 h-10 rounded-full flex items-center justify-center relative ${bgClass} ${textClass} ${todayRing}">
              ${innerHTML}
              ${dotHTML}
              ${heartHTML}
              ${pillHTML}
            </div>
          </div>
        `;
      }
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function openModal(d) {
      selectedDateStr = fmtDate(d);
      const days = ['일','월','화','수','목','금','토'];
      document.getElementById('modal-date').innerText = `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
      
      const log = logs[selectedDateStr] || {};
      document.getElementById('toggle-period').checked = !!log.period;
      document.getElementById('toggle-spotting').checked = !!log.spotting;
      document.getElementById('toggle-pill').checked = !!log.pill;
      document.getElementById('toggle-heart').checked = !!log.heart;

      document.getElementById('backdrop').classList.replace('opacity-0', 'opacity-100');
      document.getElementById('backdrop').classList.replace('pointer-events-none', 'pointer-events-auto');
      document.getElementById('modal').classList.replace('modal-down', 'modal-up');
    }

    function closeModal() {
      document.getElementById('backdrop').classList.replace('opacity-100', 'opacity-0');
      document.getElementById('backdrop').classList.replace('pointer-events-auto', 'pointer-events-none');
      document.getElementById('modal').classList.replace('modal-up', 'modal-down');
    }

    function saveLog() {
      const period = document.getElementById('toggle-period').checked;
      const spotting = document.getElementById('toggle-spotting').checked;
      const pill = document.getElementById('toggle-pill').checked;
      const heart = document.getElementById('toggle-heart').checked;

      if (period || spotting || pill || heart) {
        logs[selectedDateStr] = { period, spotting, pill, heart };
      } else {
        delete logs[selectedDateStr];
      }
      closeModal();
      setTimeout(renderCalendar, 300);
    }

    // 앱 실행 시 첫 달력 렌더링
    renderCalendar();
  </script>
</body>
</html>
